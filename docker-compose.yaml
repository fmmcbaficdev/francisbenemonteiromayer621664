
services:
  postgres:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME:-seplag}-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - seplag-network
      - backend-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # MINIO - Object Storage (S3-compatible)

  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-seplag}-minio
    restart: unless-stopped

    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    networks:
      - seplag-network
      - backend-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # BACKEND - Spring Boot Application

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ${COMPOSE_PROJECT_NAME:-seplag}-backend
    restart: unless-stopped

    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # MinIO
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_PRESIGNED_URL_EXPIRY_MINUTES: ${MINIO_PRESIGNED_URL_EXPIRY_MINUTES:-30}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-300000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Rate Limiting
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-10}

      # External API
      EXTERNAL_REGIONAIS_API_URL: ${EXTERNAL_REGIONAIS_API_URL}

      # Logging
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_BR_GOV_MT_SEPLAG: ${LOG_LEVEL_APP:-DEBUG}

      # JVM
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}

      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks:
      - seplag-network
      - frontend-network
      - backend-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


#   FRONTEND - React + Nginx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}

    container_name: ${COMPOSE_PROJECT_NAME:-seplag}-frontend
    restart: unless-stopped

    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      - backend

    networks:
      - seplag-network
      - frontend-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# VOLUMES - Persistência

volumes:
  postgres_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-seplag}_postgres_data

  minio_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-seplag}_minio_data


# NETWORKS

networks:
  seplag-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-seplag}_network

  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge
