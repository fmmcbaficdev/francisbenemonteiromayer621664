# ============================================
# VOLUMES - Persistência
# ============================================
volumes:
  postgres_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-seplag}_postgres_data

  minio_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-seplag}_minio_data

# ============================================
# NETWORKS
# ============================================
networks:
  backend-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-seplag}_backend_network
