# ============================================
# PROFILE: PRODUÇÃO
# ============================================
# Ativar com: --spring.profiles.active=prod
# IMPORTANTE: Todas as credenciais DEVEM vir de variáveis de ambiente!

# JWT - OBRIGATÓRIO definir via variável de ambiente
# jwt.secret=${JWT_SECRET}  # Já configurado no application.properties

# Database - Desabilitar logs SQL
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Logging de produção
logging.level.root=WARN
logging.level.br.gov.mt.seplag=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Segurança adicional
spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator - Expor apenas health em produção
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
