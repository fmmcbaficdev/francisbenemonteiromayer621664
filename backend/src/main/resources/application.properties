# APPLICATION
spring.application.name=backend
server.port=${SERVER_PORT:8080}

# DATABASE - PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seplag}
spring.datasource.username=${DB_USERNAME:seplag}
spring.datasource.password=${DB_PASSWORD:seplag123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial baseline
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true

# JWT CONFIGURATION
jwt.secret=c2VwbGFnLW10LXNlY3JldC1rZXktdmVyeS1zZWN1cmUtMjAyNC1wcm9qZWN0LWZ1bGxzdGFjay1zZW5pb3I=
jwt.expiration=300000
jwt.refresh-expiration=86400000


# SECURITY
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin123}

# MINIO (S3)
minio.url=http://localhost:9000
minio.access-key=admin
minio.secret-key=admin123
minio.bucket-name=seplag-albuns
minio.presigned-url-expiry-minutes=30

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# RATE LIMITING
rate-limit.requests-per-minute=10

# EXTERNAL API
external.regionais-api-url=https://integrador-argus-api.geia.vip/v1/regionais

# ACTUATOR & HEALTHCHECKS
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# LOGGING
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.br.gov.mt.seplag=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}

logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_PARAMS:TRACE}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# MULTIPART (UPLOAD)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JACKSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Cuiaba

# SPRINGDOC / SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.default-flat-param-object=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


# Pool de Conexões HikariCP (opcional mas recomendado)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

server.error.include-message=always
server.error.include-binding-errors=always