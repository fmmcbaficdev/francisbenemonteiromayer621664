spring.application.name=backend
server.port=${SERVER_PORT:8080}

# ============================================
# DATABASE - PostgreSQL
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seplag}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seplag}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:seplag123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================
# FLYWAY
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial baseline
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# JWT Configuration
# IMPORTANTE: Em produção, definir JWT_SECRET como variável de ambiente
# Gerar secret seguro: openssl rand -base64 64
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_ENV_VAR}
jwt.expiration=${JWT_EXPIRATION:300000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# ============================================
# MINIO (S3)
# ============================================
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:seplag-albuns}
minio.presigned-url-expiry-minutes=${MINIO_PRESIGNED_URL_EXPIRY_MINUTES:30}

# ============================================
# SECURITY
# ============================================
# Credenciais padrão do Spring Security (não usadas com JWT, mas externalizadas por segurança)
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin123}

# Permitir frames para H2 Console (apenas dev)
spring.h2.console.enabled=false

# ============================================
# CORS
# ============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:80}

# ============================================
# RATE LIMITING
# ============================================
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:10}

# ============================================
# EXTERNAL API - Regionais
# ============================================
external.regionais-api-url=${EXTERNAL_REGIONAIS_API_URL:https://integrador-argus-api.geia.vip/v1/regionais}

# ============================================
# ACTUATOR & METRICS
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# ============================================
# LOGGING
# ============================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.br.gov.mt.seplag=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}

# Remover em produ��o
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_PARAMS:TRACE}

# Padr�o de log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# MULTIPART (Upload)
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# JACKSON (JSON)
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Cuiaba

# ============================================
# SPRINGDOC / SWAGGER
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.default-flat-param-object=true