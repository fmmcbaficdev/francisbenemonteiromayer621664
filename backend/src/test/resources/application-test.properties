# ============================================
# TEST PROFILE
# ============================================
spring.application.name=backend-test

# ============================================
# DATABASE - H2 (In-Memory)
# ============================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.defer-datasource-initialization=true

# ============================================
# FLYWAY (Disabled for tests)
# ============================================
spring.flyway.enabled=false

# ============================================
# JWT
# ============================================
jwt.secret=c2VwbGFnLW10LXNlY3JldC1rZXktdmVyeS1zZWN1cmUtMjAyNC1wcm9qZWN0LWZ1bGxzdGFjay1zZW5pb3I=
jwt.expiration=300000
jwt.refresh-expiration=86400000

# ============================================
# MINIO (Mock)
# ============================================
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=test-bucket
minio.presigned-url-expiry-minutes=30

# ============================================
# CORS (Test)
# ============================================
cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ============================================
# RATE LIMITING (Relaxed for tests)
# ============================================
rate-limit.requests-per-minute=1000

# ============================================
# EXTERNAL API (Mock)
# ============================================
external.regionais-api-url=http://localhost:8080/mock-api/v1/regionais

# ============================================
# ACTUATOR (Test)
# ============================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.br.gov.mt.seplag=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# MULTIPART (Test)
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB